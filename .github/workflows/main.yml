name: Fortnite 21.30 Decompile & Recompile Pipeline

on:
  workflow_dispatch:

jobs:
  build-env:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Required Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full unzip python3 python3-pip curl ttyd
          sudo systemctl stop ttyd || true

      - name: Extract 7z and CppSDK Zip Archives
        run: |
          mkdir -p workspace/extracted
          7z x 21.30.0-21088273-Android.7z -oworkspace/extracted -y
          SDK_ZIP=$(find workspace/extracted -name "*.zip" | head -n 1)
          if [ -n "$SDK_ZIP" ]; then
            unzip -q "$SDK_ZIP" -d workspace/extracted/sdk_files
          fi
          ls -lh workspace/extracted

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Configure NDK Environment Inside Workspace
        run: |
          echo "export ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> workspace/env_vars.sh
          echo "export CLANG_ARM64=${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang++" >> workspace/env_vars.sh
          chmod +x workspace/env_vars.sh

      - name: Pull and Run rev.ng Container
        run: |
          docker pull revng/revng:latest
          docker run -d --name revng-box \
            -v ${{ github.workspace }}/workspace:/work \
            -p 8080:8080 \
            revng/revng:latest tail -f /dev/null

      - name: Start Web Terminal and Cloudflared Tunnel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ttyd -p 7682 -W bash &
          sleep 2
          gh release download --repo cloudflare/cloudflared -p "cloudflared-linux-amd64.deb"
          sudo dpkg -i cloudflared-linux-amd64.deb
          cloudflared tunnel --url http://localhost:7682
